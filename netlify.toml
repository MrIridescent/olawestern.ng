# Netlify config — native Next.js runtime (SSR) so /api form handlers and
# /admin work in production. The campaign's forms persist leads through these
# routes; a static export would silently drop every submission.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Static-only preview (no forms, no /admin) — use only for design review:
#   NEXT_OUTPUT=export
#   npm run export:sites
# and publish "out" instead of ".next".
