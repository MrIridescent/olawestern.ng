# Netlify config — see DEPLOY-netlify.md
# Option A (default): native Next.js runtime — SSR + /api routes + full form capture.

[build]
  command = "npm run build"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_VERSION = "20"

# Option B — static-only preview instead of SSR:
# comment the [build] block above and use:
# [build]
#   command = "npm run export:sites"
#   publish = "out"
